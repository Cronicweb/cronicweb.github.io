<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-label="Lumen Buds Pro with charging case">
  <defs>
    <linearGradient id="caseG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eceef2"/><stop offset="1" stop-color="#c9cdd6"/>
    </linearGradient>
    <linearGradient id="budG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d7de"/>
    </linearGradient>
  </defs>

  <ellipse cx="260" cy="392" rx="200" ry="16" fill="#000" opacity=".10"/>

  <!-- case -->
  <rect x="150" y="150" width="220" height="200" rx="56" fill="url(#caseG)"/>
  <path d="M150 206h220" stroke="#b9bec8" stroke-width="3"/>
  <circle cx="260" cy="318" r="7" fill="#9aa0ab"/>

  <!-- left bud -->
  <g transform="translate(60,60)">
    <ellipse cx="46" cy="46" rx="44" ry="40" fill="url(#budG)"/>
    <ellipse cx="46" cy="42" rx="20" ry="16" fill="#8f96a3" opacity=".55"/>
    <path d="M34 82c-6 34-2 66 12 88 8 12 26 10 30-4 6-24 4-58-6-86Z" fill="url(#budG)"/>
    <rect x="46" y="140" width="14" height="10" rx="4" fill="#aab0bb"/>
  </g>

  <!-- right bud -->
  <g transform="translate(320,60)">
    <ellipse cx="94" cy="46" rx="44" ry="40" fill="url(#budG)"/>
    <ellipse cx="94" cy="42" rx="20" ry="16" fill="#8f96a3" opacity=".55"/>
    <path d="M106 82c6 34 2 66-12 88-8 12-26 10-30-4-6-24-4-58 6-86Z" fill="url(#budG)"/>
    <rect x="80" y="140" width="14" height="10" rx="4" fill="#aab0bb"/>
  </g>
</svg>
