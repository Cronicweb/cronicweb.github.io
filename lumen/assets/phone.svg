      <stop offset="0"   stop-color="#8f8f96"/>
      <stop offset=".18" stop-color="#e9e9ee"/>
      <stop offset=".38" stop-color="#6f6f77"/>
      <stop offset=".62" stop-color="#c9c9d1"/>
      <stop offset=".85" stop-color="#5f5f68"/>
